<svg xmlns="http://www.w3.org/2000/svg" width="650" height="300" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(30, 50)">
    
    <!-- AUTHOR TABLE -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="130" rx="6" ry="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
      <!-- Header -->
      <path d="M0 6 Q0 0 6 0 L194 0 Q200 0 200 6 L200 35 L0 35 Z" fill="#4CAF50"/>
      <text x="100" y="22" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">AUTHOR</text>
      <!-- Rows -->
      <line x1="0" y1="65" x2="200" y2="65" stroke="#f0f0f0" stroke-width="1"/>
      <line x1="0" y1="95" x2="200" y2="95" stroke="#f0f0f0" stroke-width="1"/>
      <!-- Text -->
      <text x="15" y="55" font-size="13" fill="#cfab23" font-weight="bold">PK</text>
      <text x="45" y="55" font-size="13" fill="#333333" font-weight="bold">id</text>
      <text x="185" y="55" font-size="12" fill="#888888" text-anchor="end">Long</text>
      
      <text x="45" y="85" font-size="13" fill="#333333">name</text>
      <text x="185" y="85" font-size="12" fill="#888888" text-anchor="end">String</text>
      
      <text x="45" y="115" font-size="13" fill="#333333">nationality</text>
      <text x="185" y="115" font-size="12" fill="#888888" text-anchor="end">String</text>
    </g>

    <!-- RELATIONSHIP LINE -->
    <g transform="translate(200, 50)">
      <path d="M 0 0 L 90 0 L 90 60 L 170 60" fill="none" stroke="#607D8B" stroke-width="2.5" stroke-dasharray="4 4"/>
      <!-- Cardinality 1 -->
      <path d="M 10 -8 L 10 8 M 15 -8 L 15 8" fill="none" stroke="#607D8B" stroke-width="2"/>
      <!-- Cardinality Many -->
      <path d="M 170 60 L 155 50 M 170 60 L 155 70 M 160 50 L 160 70" fill="none" stroke="#607D8B" stroke-width="2"/>
      
      <!-- Labels -->
      <rect x="35" y="-12" width="75" height="20" rx="4" fill="#E8F5E9"/>
      <text x="72" y="2" font-size="11" fill="#2E7D32" font-weight="bold" text-anchor="middle">writes (1:N)</text>
    </g>

    <!-- BOOK TABLE -->
    <g transform="translate(370, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="160" rx="6" ry="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
      <!-- Header -->
      <path d="M0 6 Q0 0 6 0 L194 0 Q200 0 200 6 L200 35 L0 35 Z" fill="#2196F3"/>
      <text x="100" y="22" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">BOOK</text>
      <!-- Rows -->
      <line x1="0" y1="65" x2="200" y2="65" stroke="#f0f0f0" stroke-width="1"/>
      <line x1="0" y1="95" x2="200" y2="95" stroke="#f0f0f0" stroke-width="1"/>
      <line x1="0" y1="125" x2="200" y2="125" stroke="#f0f0f0" stroke-width="1"/>
      <!-- Text -->
      <text x="15" y="55" font-size="13" fill="#cfab23" font-weight="bold">PK</text>
      <text x="45" y="55" font-size="13" fill="#333333" font-weight="bold">id</text>
      <text x="185" y="55" font-size="12" fill="#888888" text-anchor="end">Long</text>
      
      <text x="45" y="85" font-size="13" fill="#333333">title</text>
      <text x="185" y="85" font-size="12" fill="#888888" text-anchor="end">String</text>
      
      <text x="45" y="115" font-size="13" fill="#333333">genre</text>
      <text x="185" y="115" font-size="12" fill="#888888" text-anchor="end">String</text>
      
      <text x="15" y="145" font-size="13" fill="#E91E63" font-weight="bold">FK</text>
      <text x="45" y="145" font-size="13" fill="#333333" font-style="italic">author_id</text>
      <text x="185" y="145" font-size="12" fill="#888888" text-anchor="end">Long</text>
    </g>

  </g>
</svg>
